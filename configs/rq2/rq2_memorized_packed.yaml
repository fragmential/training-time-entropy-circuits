output_dir: data/inferences/rq2_memorized_packed
# RQ2 T_mem packed twin for pythia: the EleutherAI memorized set in PACKED all-token geometry
# (matched to rq2_memorized_olmo for the cross-family mem comparison). Prebuilt cache.
model_name: "EleutherAI/pythia-1b-deduped"
batch_size: 32
num_samples: 16_384
dataset_name: pythia_memorized
packing: packed
token_selection: all
seq_len: 512
min_length: 32
checkpoints: "final"
hooks:
  - blk*.attn.in:both
  - blk*.mlp.up.in:both
  - before_final_norm:both
max_layers_per_pass: 0
storage_format: cov_svd
compute_metrics: True
keep_cached: True
