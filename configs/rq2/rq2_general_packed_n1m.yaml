output_dir: data/inferences/rq2_general_packed_n1m
# N-matched packed null for the memorized populations (small-N tasks need small-N nulls).
model_name:
  - "EleutherAI/pythia-1b-deduped"
  - "allenai/OLMo-2-0425-1B"

batch_size: [32, 16]   # backward-pass runs: retained graph ~3x forward VRAM
max_tokens: 1_048_576
dataset_name: native
text_shuffle_seed: 47
packing: packed
token_selection: all
seq_len: 512
min_length: 32
checkpoints: "final"

hooks:
  - blk*.attn.in:both
  - blk*.mlp.up.in:both
  - before_final_norm:both

max_layers_per_pass: 0
storage_format: cov_svd
compute_metrics: True
keep_cached: True   # concurrent same-model legs: a finishing job must not delete the cache under the others
