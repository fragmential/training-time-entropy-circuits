# Reproduce existing rankme/alpha experiments for Pythia models.
# Uses identity head replacement (fast path, post-layernorm residual), padded fineweb, last token.
# Equivalent to: rankme_alpha_scripts/extract_activations.py --collection_method identity
dataset_name: fineweb
num_samples: 2000
max_length: 512
min_length: 32
batch_size: 128
max_checkpoints: 50
packing: padded
token_selection: last
collect_residual: true
residual_hook_point: identity_head
collect_A: false
collect_G: false
collect_B: false
