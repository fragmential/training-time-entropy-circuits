output_dir: inferences/1b-minimal
# Reproduces Merullo et al. K-FAC analysis on OLMo-2 models.
# Last checkpoint only, specific layers (23/24/25 for 7B, 14/15 for 1B),
# gate+up+down projections, A+G covariance at 60% energy.

model_name:
  - "allenai/OLMo-2-0425-1B"


batch_size: 32
target_layers: [14, 15]

dataset_name: olmo_mix
num_samples: 5000
seq_len: 512
min_length: 32
max_checkpoints: 10
packing: packed
token_selection: all
collect_final_acts: true
residual_hook_point: before_final_norm
collect_A: true
collect_G: true
sample_labels: true
label_samples: 1
seed: 42
max_layers_per_pass: 4
storage_format: eigenvalues
