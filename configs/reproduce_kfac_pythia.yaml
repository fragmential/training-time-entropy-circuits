# Reproduce existing K-FAC factor collection for Pythia models.
# Uses packed fineweb, all tokens, A+G covariance, sampled labels (true Fisher).
# Equivalent to: kfac_scripts/collect_kfac.py --sample_labels true
dataset_name: fineweb
num_samples: 5000
seq_len: 512
min_length: 32
batch_size: 32
max_checkpoints: 30
packing: packed
token_selection: all
collect_residual: false
collect_A: true
collect_G: true
collect_B: false
sample_labels: true
label_samples: 1
seed: 42
layers_per_pass: 4
storage_format: cov
