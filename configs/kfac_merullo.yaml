# Reproduces Merullo et al. K-FAC analysis on OLMo-2 models.
# Last checkpoint only, specific layers (23/24/25 for 7B, 14/15 for 1B),
# gate+up+down projections, A+G covariance at 60% energy.

model_name:
  - "allenai/OLMo-2-0425-1B"
  - "allenai/OLMo-2-1124-7B"

#            OL1B OL7B
batch_size: [  64,  16]

# target_layers set per model: 7B uses layers 23,24,25; 1B uses layers 14,15
target_layers:
  allenai/OLMo-2-0425-1B: [14, 15]
  allenai/OLMo-2-1124-7B: [23, 24, 25]

dataset_name: olmo_mix
num_samples: 5000
seq_len: 512
min_length: 32
max_checkpoints: 1
packing: packed
token_selection: all
collect_residual: false
collect_A: true
collect_G: true
collect_B: false
sample_labels: true
label_samples: 1
seed: 42
max_layers_per_pass: 4
storage_format: cov_svd+m
