output_dir: data/inferences/final_stream_svd
# Unembedding program (plan.md item 1b): final-stream covariance EIGENVECTORS across
# checkpoints — cov_svd at the two final leaves only (the samples sweeps persist
# eigenvalues, which cannot give the stream ↔ unembedding row-space alignment).

model_name:
  - "allenai/OLMo-2-0425-1B"
  - "allenai/OLMo-2-1124-7B"
  - "EleutherAI/pythia-1b-deduped"
  - "EleutherAI/pythia-6.9b-deduped"
  - "EleutherAI/pythia-160m-deduped"
  - "EleutherAI/pythia-410m-deduped"
  - "nanochat-d12"

#            OL1B    OL7B   Py1b    Py6.9b  Py160m   Py410m  nanochat
batch_size: [  48,     32,   256,      72,     256,     256,   128]
max_tokens: [262_144, 81_920, 262_144, 98_304, 262_144, 262_144, 262_144]

packed_data_path:
  allenai/*: data/mixes/olmo_mix_30M_512.pt
  EleutherAI/*: data/mixes/pile_30M_512.pt
  nanochat-d12: data/mixes/fineweb_edu_nanochat_1M_512.pt

seq_len: 512
min_length: 32
max_checkpoints: 20
checkpoint_spacing: log
packing: packed
token_selection: all

hooks:
  - before_final_norm
  - after_final_norm

max_layers_per_pass: 0
storage_format: cov_svd
compute_metrics: False
keep_cached: False
