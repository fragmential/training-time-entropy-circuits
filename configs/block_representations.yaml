output_dir: data/inferences/block_representations
# Forward-only capture of block-level representations using the new pattern-based
# hook selection: MLP linear inputs + per-block sub-block boundaries + final-norm
# residual stream on both sides. Same models / data / checkpoints as
# kfac_small_shuffled, but no gradient pass and stored as cov_svd+m.

model_name:
  - "allenai/OLMo-2-0425-1B"
  - "allenai/OLMo-2-1124-7B"
  - "EleutherAI/pythia-1b-deduped"
  - "EleutherAI/pythia-6.9b-deduped"

#            OL1B OL7B Py1b Py6.9b
batch_size: [  48,  32,  128,  56]

target_layers:
  allenai/OLMo-2-0425-1B: [0, 5, 10, 15]
  allenai/OLMo-2-1124-7B: [0, 10, 21, 31]
  EleutherAI/pythia-1b-deduped: [0, 5, 10, 15]
  EleutherAI/pythia-6.9b-deduped: [0, 10, 21, 31]

packed_data_path:
  allenai/*: data/mixes/olmo_mix_30M_512.pt
  EleutherAI/*: data/mixes/pile_30M_512.pt

max_tokens: 6_000_000
seq_len: 512
min_length: 32
max_checkpoints: 20
checkpoint_spacing: sqrt
packing: packed
token_selection: all

hooks:
  # - blk*.up                # MLP input A
  # - blk*.down              # MLP middle (down-proj input)
  # - blk*.gate              # OLMo-2 only: gate-proj input
  - blk*.attn.in           # residual into attn sub-block
  - blk*.attn.head*        # attention's per-head outputs
  - blk*.attn.out          # attention's contribution to residual
  - blk*.attn.raw_out      # OLMo-2 only: pre-post-norm attn output
  - blk*.mlp.in            # OLMo-2 only: residual into MLP sub-block
  - blk*.mlp.out           # MLP's contribution to residual
  - before_final_norm
  - after_final_norm
# grad_all: false   # default — no gradients in this config

max_layers_per_pass: [4, 4, 4, 4]
storage_format: cov_svd+m
compute_metrics: True
keep_cached: False
