output_dir: data/inferences/block_representations_padded
# Data-mode ablation: block_representations with ONLY the data mode changed — padded
# sequences, last-token rows, shuffled text sampling (padded texts otherwise come from the
# dataset HEAD). Same layer subset + hooks; isolates the packed-all vs padded-last effect.
# num_samples (= rows) is provisional — adjust before the run.

model_name:
  - "allenai/OLMo-2-0425-1B"
  - "allenai/OLMo-2-1124-7B"
  - "EleutherAI/pythia-1b-deduped"
  - "EleutherAI/pythia-6.9b-deduped"

#            OL1B OL7B Py1b Py6.9b
batch_size: [  48,  32,  256,  72]

target_layers:
  allenai/OLMo-2-0425-1B: [0, 1, 3, 5, 8, 10, 13, 15]
  allenai/OLMo-2-1124-7B: [0, 1, 5, 10, 15, 21, 26, 31]
  EleutherAI/pythia-1b-deduped: [0, 1, 3, 5, 8, 10, 13, 15]
  EleutherAI/pythia-6.9b-deduped: [0, 1, 5, 10, 15, 21, 26, 31]

dataset_name: native
num_samples: 50_000
text_shuffle_seed: 42
seq_len: 512
max_length: 512
min_length: 32
max_checkpoints: 30
checkpoint_spacing: sqrt
packing: padded
token_selection: last

hooks:
  - blk*.attn.in           # residual into attn sub-block
  - blk*.attn.head*.slice  # attention's per-head pre-W_o slices
  - blk*.attn.out          # attention's contribution to residual
  - blk*.attn.raw_out      # OLMo-2 only: pre-post-norm attn output
  - blk*.mlp.in            # OLMo-2 only: residual into MLP sub-block
  - blk*.mlp.out           # MLP's contribution to residual
  - blk*.mlp.raw_out       # OLMo-2 only: pre-post-norm MLP output
  - before_final_norm
  - after_final_norm

max_layers_per_pass: 0
storage_format: eigenvalues
compute_metrics: True
keep_cached: False
