output_dir: data/inferences/nanochat
# Full-suite collection (minus drift, which stays off by default) for the locally
# trained nanochat d12 model. Checkpoints + tokenizer live under $NANOCHAT_DIR
# (default /projects/prjs1815/nanochat); nothing is downloaded from HF except the
# fineweb-edu text data, which is tokenized + packed on the fly with the rustbpe
# tokenizer (nanochat has no pre-built mix — its vocab differs from Pile/OLMo-mix).

model_name: "nanochat-d12"

batch_size: 128    # the 65536-vocab logits tensor dominates VRAM (bs*512*65536); 256 OOMs a 40GB A100

dataset_name: native            # -> fineweb_edu_100b (karpathy/fineweb-edu-100b-shuffle)
max_bytes: 5_000_000            # ~1.2M nanochat tokens (max_tokens only caps pre-built mixes)
seq_len: 512
min_length: 32
max_checkpoints: 30
checkpoint_spacing: sqrt
packing: packed
token_selection: all

hooks:
  - blk*.attn.in           # residual into attn sub-block (ln1 input)
  - blk*.attn.head*.slice  # attention's per-head pre-W_o slices
  - blk*.attn.out          # attention's contribution to residual
  - blk*.mlp.in            # mid-block residual (ln2 input)
  - blk*.mlp.out           # MLP's contribution to residual
  - before_final_norm
  - after_final_norm

max_layers_per_pass: 0
storage_format: eigenvalues
compute_metrics: True
vocab_entropy: True
keep_cached: False
