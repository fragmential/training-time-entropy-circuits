output_dir: inferences/benchmark
# Benchmark config: 2 layers in separate passes + both residuals, 1 checkpoint

model_name: "allenai/OLMo-2-0425-1B"
batch_size: 48
target_layers: [0, 15]
packed_data_path: data/mixes/olmo_mix_6M_512.pt
max_tokens: 200_000
seq_len: 512
min_length: 32
checkpoints: [0]
packing: packed
token_selection: all
collect_final_acts: true
collect_final_grads: true
residual_hook_point: both
collect_A: true
collect_G: true
sample_labels: true
label_samples: 1
seed: 42
max_layers_per_pass: 1
storage_format: cov_svd+m
compute_metrics: True
keep_cached: True
