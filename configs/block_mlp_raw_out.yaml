output_dir: data/inferences/block_mlp_raw_out
# Forward-only capture of ONLY the raw MLP output (pre-post-feedforward-norm,
# i.e. the down-proj output) at each sub-block boundary. Same models / data /
# checkpoints as block_representations; OLMo-2 only (Pythia's mlp.raw_out aliases
# to mlp.out). Stored as cov_svd+m.

model_name:
  - "allenai/OLMo-2-0425-1B"
  - "allenai/OLMo-2-1124-7B"
  - "EleutherAI/pythia-1b-deduped"
  - "EleutherAI/pythia-6.9b-deduped"

#            OL1B OL7B Py1b Py6.9b
batch_size: [  256,  96,  128,  56]

target_layers:
  allenai/OLMo-2-0425-1B: [0, 1, 3, 5, 8, 10, 13, 15]
  allenai/OLMo-2-1124-7B: [0, 1, 5, 10, 15, 21, 26, 31]
  EleutherAI/pythia-1b-deduped: [0, 1, 3, 5, 8, 10, 13, 15]
  EleutherAI/pythia-6.9b-deduped: [0, 1, 5, 10, 15, 21, 26, 31]

packed_data_path:
  allenai/*: data/mixes/olmo_mix_30M_512.pt
  EleutherAI/*: data/mixes/pile_30M_512.pt

max_tokens: 6_000_000
seq_len: 512
min_length: 32
max_checkpoints: 30
checkpoint_spacing: sqrt
packing: packed
token_selection: all

hooks:
  - blk*.mlp.raw_out       # OLMo-2: pre-post-norm MLP output (= down-proj output)

max_layers_per_pass: 0
storage_format: cov_svd+m
compute_metrics: True
keep_cached: False
