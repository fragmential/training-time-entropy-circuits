output_dir: data/inferences/role_smoketest
# Full-coverage smoke test for the role.quantity refactor on a tiny model.
# Exercises every node kind: mlp (in/out + gen + kfac), per-OV-head (slice/contrib),
# block boundaries (value), and final-norm residual (value + gen + kfac).
# Pythia has no gate and no mlp.in/attn.raw_out — those patterns are silent no-ops.

model_name: EleutherAI/pythia-14m

checkpoints: [0, 1000, 143000]

dataset_name: native            # pile for Pythia
packed_data_path: data/mixes/pile_6M_512.pt
packing: packed
token_selection: all
max_tokens: 2_000_000
seq_len: 512
min_length: 32

batch_size: 64
sample_labels: false            # no full-vocab softmax (not needed for this test; avoids OOM)
max_layers_per_pass: 0          # all 6 blocks in one pass

hooks:
  - blk*.up+G                   # MLP: in.acts, out.acts(derived), out.grads, out.gen, kfac
  - blk*.down+G
  - blk*.attn.head*+G           # per-OV-head: slice.acts/grads + slice.gen; contrib.acts(derived)
  - blk*.attn.in                # boundary: value.acts
  - blk*.attn.out
  - blk*.mlp.out
  - before_final_norm+G         # residual: value.acts/grads + value.gen + kfac
  - after_final_norm+G

storage_format: cov_svd+m+o
compute_metrics: true
keep_cached: true
