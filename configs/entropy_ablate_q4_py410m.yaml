output_dir: data/inferences/entropy_ablate
# The last-quarter version of configs/entropy_ablate_py410m.yaml: instead of one block, the
# top-n neurons by rho POOLED over the final 6 blocks (pythia-410m-deduped's last quarter),
# which should be the maximal-impact ablation of this kind. n is a total, not per block.
# Same output_dir base, hooks, token budget and schedule as the two-block run, so the
# blk-1_rho0 baseline collected there is the right reference -- no baseline spec here.
# Matched-count random pooled over the same blocks is the control.

model_name: "EleutherAI/pythia-410m-deduped"
batch_size: 256
max_tokens: 65_536
packed_data_path: data/mixes/pile_30M_512.pt

seq_len: 512
min_length: 32
max_checkpoints: 20
checkpoint_spacing: log
packing: packed
token_selection: all
activation_dtype: bf16

hooks:
  - blk23.mlp.out
  - blk22.mlp.out
  - before_final_norm
  - after_final_norm

max_layers_per_pass: 0
collect_format: acts
storage_format: eigenvalues
compute_metrics: True
vocab_entropy: True
drift_metrics: False
keep_cached: False  # snapshots accumulate past the project quota otherwise

ablate_mode: mean
ablate_neurons:
  - {block: [-1, -2, -3, -4, -5, -6], rank: rho, n: 64}
  - {block: [-1, -2, -3, -4, -5, -6], rank: rho, n: 256}
  - {block: [-1, -2, -3, -4, -5, -6], rank: rho, n: 1024}
  - {block: [-1, -2, -3, -4, -5, -6], rank: random, n: 64}
  - {block: [-1, -2, -3, -4, -5, -6], rank: random, n: 256}
  - {block: [-1, -2, -3, -4, -5, -6], rank: random, n: 1024}
