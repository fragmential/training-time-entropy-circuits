output_dir: data/inferences/debug
# Full collection (final checkpoint only): pre-norm residual + A + G covariance.
# Packed training data, all tokens. "native" resolves per model family.

model_name: "EleutherAI/pythia-14m"

batch_size:          32
max_layers_per_pass: 3

dataset_name: native
max_bytes: 10_000_000
seq_len: 512
min_length: 32
checkpoints: final
packing: packed
token_selection: all
collect_final_acts: true
residual_hook_point: before_final_norm
collect_A: true
collect_G: true
sample_labels: true
label_samples: 1
seed: 42
storage_format: eigenvalues+mb
