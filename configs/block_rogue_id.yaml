output_dir: data/inferences/block_rogue_id
# Rogue-direction token identification: RAW samples (storage acts) at the rogue write and its
# stream context, final checkpoint only. Rows map back to token ids deterministically via the
# packed mix (chunks in file order, token_selection=all -> all positions except each chunk's
# last). Hypothesis: the rogue direction is sparse token spikes (huge on rare
# delimiter/sink-like tokens, ~0 elsewhere) — mean_frac ~ 0.003 with rank-1 variance.

model_name:
  - "EleutherAI/pythia-1b-deduped"
  - "EleutherAI/pythia-6.9b-deduped"

batch_size: [256, 72]
max_tokens: [262_144, 98_304]

packed_data_path:
  EleutherAI/*: data/mixes/pile_30M_512.pt

seq_len: 512
min_length: 32
checkpoints: "final"
packing: packed
token_selection: all
activation_dtype: bf16

hooks:
  - blk3.attn.in       # stream entering the rogue block
  - blk3.mlp.out       # the rogue write itself
  - before_final_norm  # does the final stream spike on the same tokens?

max_layers_per_pass: 0
collect_format: acts
storage_format: acts   # persist raw samples — the whole point
compute_metrics: False
keep_cached: False
