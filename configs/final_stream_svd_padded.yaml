output_dir: data/inferences/final_stream_svd_padded
# Padded (last-token) twin of final_stream_svd.yaml: final-stream covariance EIGENVECTORS
# across checkpoints (cov_svd at the two final leaves) — the data-dependent half of the
# unembedding program. Independent rows (padded, last token, native shuffled text).
# nanochat-d12 excluded (no padded data). The head-weight singular spectra
# (unembedding_spectra.py) are weight-only and identical for packed/padded — not rerun.

model_name:
  - "allenai/OLMo-2-0425-1B"
  - "allenai/OLMo-2-1124-7B"
  - "EleutherAI/pythia-1b-deduped"
  - "EleutherAI/pythia-6.9b-deduped"
  - "EleutherAI/pythia-160m-deduped"
  - "EleutherAI/pythia-410m-deduped"

#              OL1B    OL7B   Py1b    Py6.9b  Py160m   Py410m
batch_size:  [  48,     32,   256,      72,     256,     256]
num_samples: 16_384

dataset_name: native
text_shuffle_seed: 42
seq_len: 512
max_length: 512
min_length: 32
max_checkpoints: 20
checkpoint_spacing: log
packing: padded
token_selection: last

hooks:
  - before_final_norm
  - after_final_norm

max_layers_per_pass: 0
storage_format: cov_svd
compute_metrics: False
keep_cached: False
